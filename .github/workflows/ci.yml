name: CI

on:
  push:
  pull_request:

jobs:
  coordinator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coordinator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B test

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile app.py lamport.py classifier.py
